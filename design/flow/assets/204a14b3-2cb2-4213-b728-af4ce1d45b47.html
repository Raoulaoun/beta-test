<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./styles.css">
<style>* { box-sizing:border-box; } body { margin:0; }</style>
</helmet>
<div style="position:relative;width:1080px;height:{{ h }};overflow:hidden;background:linear-gradient(168deg,#0B1F3A 0%,#0D2C3F 40%,#0E4A44 78%,#0E6B4F 120%);font-family:var(--site-font-body);color:#F5F6F4">
  <div style="position:absolute;right:-20%;bottom:-25%;width:90%;height:70%;border-radius:50%;background:radial-gradient(closest-side,rgba(63,145,116,0.30),rgba(63,145,116,0))"></div>
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:{{ pad }}">
    <div style="display:flex;align-items:center;gap:16px">
      <img src="assets/beta-mark-light.png" alt="Beta" style="height:46px;width:auto;display:block">
      <span style="font-family:var(--site-font-display);font-weight:700;font-size:38px;letter-spacing:-0.035em;line-height:1;color:#F5F6F4">beta</span>
      <span style="width:1.5px;height:36px;background:rgba(245,246,244,0.24);margin:0 4px"></span>
      <span style="font-size:28px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#C3CBD5;line-height:1">The Manager Test</span>
    </div>

    <div style="flex:1;display:flex;flex-direction:{{ bodyDir }};align-items:center;justify-content:center;gap:{{ bodyGap }}">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px">
        <sc-if value="{{ nameOn }}" hint-placeholder-val="{{ false }}">
          <span style="font-size:40px;font-weight:600;color:#C3CBD5;line-height:1">{{ firstName }}'s score</span>
        </sc-if>
        <div style="position:relative;width:{{ dial }};height:{{ dial }}">
          <svg viewBox="0 0 200 200" style="width:100%;height:100%;transform:rotate(-90deg)"><circle cx="100" cy="100" r="88" fill="none" stroke="rgba(245,246,244,0.14)" stroke-width="10"></circle><circle cx="100" cy="100" r="88" fill="none" stroke="#9FDCBE" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{ dash }}"></circle></svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
            <span style="font-family:var(--site-font-display);font-weight:700;font-size:{{ scoreSize }};letter-spacing:-0.05em;line-height:0.9;color:#F5F6F4;font-variant-numeric:tabular-nums">{{ score }}</span>
            <span style="font-size:30px;font-weight:600;color:#C3CBD5;margin-top:8px">out of 100</span>
          </div>
        </div>
        <span style="display:inline-flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;background:rgba(159,220,190,0.14);border:1.5px solid rgba(159,220,190,0.4);font-size:34px;font-weight:700;color:#9FDCBE;line-height:1"><span style="width:12px;height:12px;border-radius:50%;background:#9FDCBE"></span>{{ band }}</span>
      </div>

      <div style="width:{{ barsW }};display:flex;flex-direction:column;gap:26px">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="5">
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;justify-content:space-between;gap:16px;font-size:28px;line-height:1.2"><span style="font-weight:500;color:#E6EAEE">{{ b.name }}</span><span style="font-weight:700;color:#F5F6F4;font-variant-numeric:tabular-nums">{{ b.score }}</span></div>
            <div style="height:10px;border-radius:999px;background:rgba(245,246,244,0.14);overflow:hidden"><div style="height:100%;width:{{ b.w }};border-radius:999px;background:#9FDCBE"></div></div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;padding-top:32px;border-top:1.5px solid rgba(245,246,244,0.16)">
      <span style="font-family:var(--site-font-display);font-size:40px;font-weight:700;letter-spacing:-0.03em;line-height:1.1;color:#F5F6F4">Are you ready to manage money?</span>
      <span style="font-size:30px;font-weight:500;line-height:1.3;color:#C3CBD5">Take the free test · <span style="color:#9FDCBE;font-weight:600">managertest.betaapp.me</span></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;format&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;story&quot;,&quot;post&quot;],&quot;default&quot;:&quot;story&quot;,&quot;tsType&quot;:&quot;'story'|'post'&quot;},&quot;firstName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Karim&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showName&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;score&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:67,&quot;min&quot;:0,&quot;max&quot;:100,&quot;tsType&quot;:&quot;number&quot;},&quot;band&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Emerging Manager&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pillars&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[74,58,71,66,62],&quot;tsType&quot;:&quot;number[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const q = typeof window !== 'undefined' ? new URLSearchParams(window.location.search) : new URLSearchParams();
    const story = (p.format ?? q.get('format') ?? 'story') === 'story';
    const score = p.score ?? 67;
    const C = 2 * Math.PI * 88;
    const names = ['Risk control', 'Discipline', 'Consistency', 'Risk-adjusted return', 'Track record depth'];
    const vals = p.pillars ?? [74, 58, 71, 66, 62];
    return {
      h: story ? '1920px' : '1080px',
      pad: story ? '200px 96px 220px' : '80px 80px 72px',
      bodyDir: story ? 'column' : 'row',
      bodyGap: story ? '96px' : '72px',
      dial: story ? '460px' : '380px',
      scoreSize: story ? '172px' : '140px',
      barsW: story ? '100%' : '420px',
      nameOn: (p.showName ?? true) && !!(p.firstName ?? q.get('name') ?? 'Karim'),
      firstName: p.firstName ?? q.get('name') ?? 'Karim',
      score, band: p.band ?? 'Emerging Manager',
      dash: (C * score / 100).toFixed(1) + ' ' + C.toFixed(1),
      bars: names.map((name, i) => ({ name, score: vals[i], w: vals[i] + '%' })),
    };
  }
}
</script>
</body>
</html>
